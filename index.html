<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#0EA5E9">
<title>عالم الأشكال — مغامرة تعليمية ممتعة</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#0EA5E9; --sky-dark:#0284C7; --sky-light:#E0F2FE;
    --green:#10B981; --green-dark:#047857; --green-light:#D1FAE5;
    --yellow:#F59E0B; --yellow-dark:#B45309; --yellow-light:#FEF3C7;
    --pink:#EC4899; --purple:#8B5CF6; --red:#EF4444;
    --bg:#F0F9FF; --card:#FFFFFF; --text:#0F172A; --muted:#64748B;
    --shadow-sm:0 1px 3px rgba(15,23,42,.08);
    --shadow-md:0 4px 16px rgba(15,23,42,.10);
    --shadow-lg:0 12px 32px rgba(15,23,42,.14);
    --shadow-xl:0 20px 50px rgba(15,23,42,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Tajawal',system-ui,sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; overflow-x:hidden;
    user-select:none; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Baloo Bhaijaan 2','Tajawal',sans-serif;}
  body.night{--bg:#0F172A;--card:#1E293B;--text:#F1F5F9;--muted:#94A3B8;background:#0F172A;}
  body.night .bg-white,body.night .bg-white\/95{background:#1E293B!important;}
  body.night .text-slate-800,body.night .text-slate-700,body.night .text-slate-900{color:#F1F5F9!important;}
  body.night .border-slate-200{border-color:#334155!important;}
  body.night .bg-slate-100{background:#334155!important;color:#F1F5F9!important;}
  body.calm *{animation:none!important;transition:none!important;}
  body.calm{background:#F5F3EE!important;}
  body.calm .decor{display:none!important;}

  .btn-tactile{
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
    box-shadow:0 5px 0 rgba(15,23,42,.18), var(--shadow-md);
  }
  .btn-tactile:hover{transform:translateY(-3px);}
  .btn-tactile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(15,23,42,.18);}
  .btn-tactile:focus-visible{outline:3px solid var(--sky);outline-offset:4px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both;}
  @keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
  .pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  .shake{animation:shake .4s ease-in-out;}
  @keyframes pulse-glow{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(245,158,11,.7)}50%{transform:scale(1.06);box-shadow:0 0 0 20px rgba(245,158,11,0)}}
  .pulse-glow{animation:pulse-glow 1.8s infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .float{animation:float 3s ease-in-out infinite;}
  @keyframes spin-slow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .spin-slow{animation:spin-slow 60s linear infinite;}
  @keyframes sun-rise{0%{transform:translateY(30px)}100%{transform:translateY(0)}}
  .sun-rise{animation:sun-rise 1.2s ease-out;}
  @keyframes cloud-float{0%{transform:translateX(0)}100%{transform:translateX(-30px)}}
  .cloud-float{animation:cloud-float 6s ease-in-out infinite alternate;}
  @keyframes kid-jump{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(2deg)}}
  .kid-jump{animation:kid-jump 1.4s ease-in-out infinite;}
  @keyframes kid-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
  .kid-wave{animation:kid-wave 1.8s ease-in-out infinite; transform-origin:bottom center;}
  @keyframes ball-bounce{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-25px) rotate(180deg)}}
  .ball-bounce{animation:ball-bounce 2s ease-in-out infinite;}
  @keyframes butterfly{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(15px,-10px) rotate(5deg)}50%{transform:translate(-10px,-20px) rotate(-5deg)}75%{transform:translate(-15px,-5px) rotate(3deg)}}
  .butterfly{animation:butterfly 4s ease-in-out infinite;}
  @keyframes balloon-rise{0%{transform:translateY(0)}100%{transform:translateY(-15px)}}
  .balloon{animation:balloon-rise 3s ease-in-out infinite alternate;}
  @keyframes checkMark{0%{transform:scale(0) rotate(-45deg);opacity:0}60%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
  .check-mark{animation:checkMark .7s cubic-bezier(.34,1.56,.64,1) forwards;}
  @keyframes star-burst{0%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.3) rotate(180deg);opacity:1}100%{transform:scale(1) rotate(360deg);opacity:1}}
  .star-burst{animation:star-burst .8s cubic-bezier(.34,1.56,.64,1) forwards;}
  @keyframes ring-out{0%{transform:scale(.5);opacity:1}100%{transform:scale(2.5);opacity:0}}
  .ring-out{animation:ring-out 1s ease-out forwards;}

  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;}
  .decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}

  .progress-rail{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;}
  .progress-dot{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:13px;border:3px solid #E2E8F0;
    background:#F8FAFC;color:#94A3B8;transition:all .3s ease;
  }
  .progress-dot.active{background:var(--yellow-light);border-color:var(--yellow);color:var(--yellow-dark);transform:scale(1.15);box-shadow:0 0 0 4px rgba(245,158,11,.2);}
  .progress-dot.done{background:var(--green-light);border-color:var(--green);color:var(--green-dark);}
  .progress-dot.done::before{content:"✓";font-size:16px;}

  .trace-svg{cursor:crosshair;touch-action:none;width:100%;max-width:420px;height:auto;}
  .trace-path{fill:none;stroke:#E2E8F0;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;}
  .trace-progress{fill:none;stroke:url(#traceGradient);stroke-width:22;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset .08s linear;filter:drop-shadow(0 0 6px rgba(14,165,233,.4));}

  .cover-dot{cursor:pointer;transition:transform .25s,opacity .4s;}
  .cover-dot:hover,.cover-dot:focus{transform:scale(1.2);outline:none;}
  .cover-dot.covered{opacity:.1;pointer-events:none;transform:scale(.4) rotate(180deg);}

  .connect-item{
    position:relative;z-index:2;cursor:pointer;
    transition:transform .25s, box-shadow .25s;
  }
  .connect-item:hover{transform:scale(1.06);}
  .connect-item.selected{
    box-shadow:0 0 0 6px rgba(14,165,233,.5), 0 8px 20px rgba(14,165,233,.3);
    transform:scale(1.08);
  }
  .connect-item.matched{
    opacity:.5;pointer-events:none;
    box-shadow:0 0 0 4px rgba(16,185,129,.6);
  }
  .connect-item.matched::after{
    content:"✓";position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    color:#10B981;font-size:3rem;font-weight:900;
    background:rgba(16,185,129,.15);border-radius:1rem;
    z-index:3;
  }

  /* بطاقة الشكل الكرتونية */
  .shape-card{
    background:white;
    border-radius:2rem;
    padding:1rem;
    transition:all .3s;
    box-shadow:var(--shadow-md);
  }
  .shape-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}

  /* زر البدء الكبير */
  .start-btn{
    background:linear-gradient(135deg,#FCD34D 0%,#F59E0B 50%,#EA580C 100%);
    box-shadow:0 10px 0 #92400E, 0 15px 40px rgba(245,158,11,.5);
    transition:all .2s;
    border:4px solid white;
  }
  .start-btn:hover{transform:translateY(-3px);box-shadow:0 13px 0 #92400E, 0 20px 50px rgba(245,158,11,.6);}
  .start-btn:active{transform:translateY(7px);box-shadow:0 3px 0 #92400E, 0 8px 20px rgba(245,158,11,.5);}

  /* خلفية مشهد المدينة */
  .city-bg{
    background:linear-gradient(180deg,#87CEEB 0%,#B0E0E6 40%,#FFE4B5 70%,#F0E68C 100%);
  }

  /* نقاط النجوم */
  .star-point{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;
    filter:drop-shadow(0 2px 3px rgba(245,158,11,.4));
  }

  /* شهادة */
  .certificate-bg{
    background:linear-gradient(135deg,#FFF8E1 0%,#FFECB3 50%,#FFF8E1 100%);
    position:relative;
    overflow:hidden;
  }
  .certificate-bg::before{
    content:"";position:absolute;inset:0;
    background-image:
      radial-gradient(circle at 20% 30%,rgba(245,158,11,.1) 0%,transparent 40%),
      radial-gradient(circle at 80% 70%,rgba(14,165,233,.1) 0%,transparent 40%);
    pointer-events:none;
  }

  @media print{
    body *{visibility:hidden;}
    #print-area,#print-area *{visibility:visible;}
    #print-area{position:fixed;top:0;left:0;width:100%;}
    .no-print{display:none!important;}
  }

  /* شريط التقدم العلوي */
  .top-progress{
    background:linear-gradient(90deg,#0EA5E9,#10B981);
    height:6px;
    border-radius:3px;
    transition:width .5s ease;
  }
</style>
</head>

const DEFAULT_STATE = {
  stars:0,
  shapeProgress:{circle:0,square:0,triangle:0,rectangle:0},
  unlocked:{circle:true,square:false,triangle:false,rectangle:false},
  mistakes:{circle:0,square:0,triangle:0,rectangle:0},
  consecutiveCorrect:{circle:0,square:0,triangle:0,rectangle:0},
  consecutiveWrong:{circle:0,square:0,triangle:0,rectangle:0},
  calm:false, night:false, muted:false, music:false,
  difficulty:3,
  childName:'',
};
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let currentShape=null, currentStage=0, currentPrompt='';

function loadState(){
  try{ const raw=localStorage.getItem('worldShapes_v5'); if(raw){ const s=JSON.parse(raw); state=Object.assign({},DEFAULT_STATE,s); } }catch(e){}
  applyTheme();
  updateTopProgress();
}
function saveState(){ try{ localStorage.setItem('worldShapes_v5', JSON.stringify(state)); }catch(e){} }
function applyTheme(){
  document.body.classList.toggle('calm', !!state.calm);
  document.body.classList.toggle('night', !!state.night);
  const mb=document.getElementById('mute-btn');
  if(mb){
    if(state.muted){
      mb.innerHTML='<svg class="icon text-xl" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
    }else{
      mb.innerHTML='<svg class="icon text-xl" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>';
    }
  }
  const sc=document.getElementById('star-count'); if(sc) sc.textContent = state.stars;
  const mu=document.getElementById('music-btn');
  if(mu){
    if(state.music){
      mu.classList.remove('bg-pink-50','text-pink-800','border-pink-200');
      mu.classList.add('bg-pink-500','text-white','border-pink-700');
    }else{
      mu.classList.add('bg-pink-50','text-pink-800','border-pink-200');
      mu.classList.remove('bg-pink-500','text-white','border-pink-700');
    }
  }
}
function updateTopProgress(){
  const total = KEYS.reduce((a,k)=>a+state.shapeProgress[k],0);
  const pct = (total/20)*100;
  const bar = document.getElementById('top-progress');
  if(bar) bar.style.width = pct + '%';
}

let actx=null, master=null, arabicVoice=null, cloudAudio=null, musicNodes=null;

function ensureAudio(){
  if(!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    actx = new AC();
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=20; comp.ratio.value=5;
    master = actx.createGain(); master.gain.value=1.0;
    comp.connect(master); master.connect(actx.destination);
    actx._out = comp;
  }
  if(actx.state==='suspended') actx.resume();
}
function initVoices(){
  if(!('speechSynthesis' in window)) return;
  const load=()=>{
    const vs=window.speechSynthesis.getVoices();
    arabicVoice=vs.find(v=>v.lang==='ar-SA')||vs.find(v=>v.lang.startsWith('ar-'))||vs.find(v=>v.lang.toLowerCase().includes('ar'))||null;
  };
  load(); window.speechSynthesis.onvoiceschanged=load;
  setTimeout(load, 500); setTimeout(load, 1500);
}
initVoices();

function tone(freq,dur=0.15,type='sine',vol=0.3,delay=0){
  if(state.muted) return;
  ensureAudio(); if(!actx) return;
  const t=actx.currentTime+delay;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  o.connect(g); g.connect(actx._out);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.start(t); o.stop(t+dur+0.05);
}
function applause(dur=1.2){
  if(state.muted) return;
  ensureAudio(); if(!actx) return;
  const sr=actx.sampleRate, len=Math.floor(sr*dur);
  const buf=actx.createBuffer(1,len,sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++){
    const t=i/len;
    const env=Math.pow(Math.sin(Math.PI*t),0.6);
    const f=0.6+0.4*Math.sin(i*0.001);
    d[i]=(Math.random()*2-1)*env*f*0.5;
  }
  const src=actx.createBufferSource(); src.buffer=buf;
  const bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1600; bp.Q.value=0.9;
  const g=actx.createGain(); g.gain.value=0.85;
  src.connect(bp); bp.connect(g); g.connect(actx._out);
  src.start(); src.stop(actx.currentTime+dur+0.05);
}
function clickSound(){ tone(560,0.07,'sine',0.22); }
function correctSound(){ tone(523,0.12); tone(659,0.12,'sine',0.3,0.1); tone(784,0.18,'sine',0.3,0.2); }
function wrongSound(){ tone(300,0.18,'triangle',0.22); tone(260,0.18,'triangle',0.18,0.13); }
function successSound(){ correctSound(); setTimeout(applause,240); }
function shapeMelody(k){
  const m={circle:[523,659],square:[440,554],triangle:[587,880],rectangle:[392,523]};
  const f=m[k]||[523,659];
  f.forEach((fr,i)=>tone(fr,0.18,'triangle',0.26,i*0.11));
}

// موسيقى خلفية هادئة
function startMusic(){
  if(!state.music || state.muted) return;
  ensureAudio(); if(!actx) return;
  stopMusic();
  const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
  musicNodes = [];
  const playLoop = ()=>{
    if(!state.music || state.muted) return;
    notes.forEach((freq, i)=>{
      const t = actx.currentTime + i*0.6;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      o.connect(g); g.connect(actx._out);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.04, t+0.1);
      g.gain.exponentialRampToValueAtTime(0.001, t+1.2);
      o.start(t); o.stop(t+1.3);
      musicNodes.push({o,g});
    });
  };
  playLoop();
  if(musicNodes._interval) clearInterval(musicNodes._interval);
  musicNodes._interval = setInterval(playLoop, 2400);
}
function stopMusic(){
  if(musicNodes){
    if(musicNodes._interval) clearInterval(musicNodes._interval);
    musicNodes.forEach(n=>{ try{n.o.stop();}catch(e){} });
    musicNodes = null;
  }
}
function toggleMusic(){
  state.music = !state.music;
  saveState(); applyTheme();
  if(state.music) startMusic(); else stopMusic();
  if(!state.music) speak('تَمَّ إِيقَافُ الْمُوسِيقَى', false);
}

function speak(text,save=true){
  if(save) currentPrompt=text;
  if(state.muted) return;
  if(cloudAudio){ try{cloudAudio.pause();}catch(e){} cloudAudio=null; }
  if('speechSynthesis' in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }

  if('speechSynthesis' in window){
    try{
      if(!arabicVoice){
        const vs=window.speechSynthesis.getVoices();
        arabicVoice=vs.find(v=>v.lang==='ar-SA')||vs.find(v=>v.lang.startsWith('ar-'))||vs.find(v=>v.lang.toLowerCase().includes('ar'))||null;
      }
      if(arabicVoice){
        const u=new SpeechSynthesisUtterance(text);
        u.lang=arabicVoice.lang; u.voice=arabicVoice;
        u.rate=0.82; u.pitch=1.15; u.volume=1.0;
        let started=false;
        u.onstart=()=>{started=true;};
        window.speechSynthesis.speak(u);
        setTimeout(()=>{
          if(!started && !state.muted){
            try{ window.speechSynthesis.cancel(); }catch(e){}
            speakCloud(text);
          }
        }, 800);
        return;
      }
    }catch(e){}
  }
  speakCloud(text);
}
function speakCloud(text){
  if(state.muted) return;
  try{
    const clean=text.replace(/[\u064B-\u065F]/g,'');
    const url=`https://translate.googleapis.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=${encodeURIComponent(clean.slice(0,180))}`;
    const a=new Audio(url);
    a.volume=1.0;
    cloudAudio=a;
    a.play().catch(()=>{});
  }catch(e){}
}
function repeatPrompt(){ clickSound(); if(currentPrompt) speak(currentPrompt,false); }

const canvas=document.getElementById('confetti'), cctx=canvas.getContext('2d');
let parts=[];
function resizeC(){canvas.width=innerWidth;canvas.height=innerHeight;}
addEventListener('resize',resizeC); resizeC();
function confetti(){
  if(state.calm) return;
  const colors=['#FACC15','#38BDF8','#FB7185','#34D399','#A855F7','#0EA5E9','#EC4899'];
  for(let i=0;i<55;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:(Math.random()-1)*16-3,s:Math.random()*12+6,c:colors[Math.floor(Math.random()*colors.length)],a:1,r:Math.random()*360,shape:Math.random()>.5?'rect':'circle'});
}
function drawConfetti(){
  cctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.4; p.a-=0.012; p.r+=5;
    if(p.a<=0){parts.splice(i,1);continue;}
    cctx.save(); cctx.globalAlpha=p.a; cctx.translate(p.x,p.y); cctx.rotate(p.r*Math.PI/180);
    cctx.fillStyle=p.c;
    if(p.shape==='rect') cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);
    else{ cctx.beginPath(); cctx.arc(0,0,p.s/2,0,Math.PI*2); cctx.fill(); }
    cctx.restore();
  }
  requestAnimationFrame(drawConfetti);
}
drawConfetti();

function adaptDifficulty(correct){
  const k=currentShape; if(!k) return;
  if(correct){
    state.consecutiveCorrect[k]=(state.consecutiveCorrect[k]||0)+1;
    state.consecutiveWrong[k]=0;
    if(state.consecutiveCorrect[k]>=3 && state.difficulty<4){ state.difficulty++; state.consecutiveCorrect[k]=0; }
  }else{
    state.consecutiveWrong[k]=(state.consecutiveWrong[k]||0)+1;
    state.consecutiveCorrect[k]=0;
    if(state.consecutiveWrong[k]>=2 && state.difficulty>2){ state.difficulty--; state.consecutiveWrong[k]=0; }
  }
  saveState();
}

function showStory(){
  const s=SHAPES[currentShape];
  let slide=0;
  speak(s.story[0].text,false);
  const app=document.getElementById('app');
  function render(){
    app.innerHTML=`
      <div class="fade-up space-y-4">
        <div class="bg-gradient-to-br from-sky-50 to-white border-4 border-sky-200 rounded-3xl p-8 text-center shadow-lg">

          </div>

          ${slide>0?`<button onclick="prevStory()" class="btn-tactile bg-slate-100 hover:bg-slate-200 text-slate-800 font-black text-lg px-6 py-3 rounded-2xl border-2 border-slate-300">← السابق</button>`:''}

            ${slide<s.story.length-1?'التالي ←':'هيا نبدأ! 🚀'}

}

        <svg class="icon" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
      </button>
      <div class="progress-rail flex-1">
        ${[1,2,3,4,5].map(n=>`<div class="progress-dot ${n<stage?'done':n===stage?'active':''}">${n<stage?'':n}</div>`).join('')}
      </div>
      <div class="text-xs font-bold text-slate-500 px-2 hidden sm:block">${STAGE_NAMES[stage-1]||''}</div>
    </div>
  `;
}

function goStage(){
  if(currentStage===0) return stageTrace();
  if(currentStage===1) return stageCover();
  if(currentStage===2) return stageConnect();
  if(currentStage===3) return stageFind();
  if(currentStage===4) return stageName();
  if(currentStage===5) return stageComplete();
}

function nextStage(){
  currentStage++;
  const k=currentShape;
  if(currentStage > state.shapeProgress[k]){
    state.shapeProgress[k] = Math.min(5,currentStage);
    if(state.shapeProgress[k]>=5){
      const idx=KEYS.indexOf(k);
      if(idx>=0 && idx<KEYS.length-1) state.unlocked[KEYS[idx+1]]=true;
    }
    saveState(); updateTopProgress();
  }
  goStage();
}

   ============================================================ */
function stageTrace(){
  const s=SHAPES[currentShape];
  speak(`الْمَرْحَلَةُ الْأُولَى: مَرِّرِي إِصْبَعَكِ عَلَى ${s.spoken}.`);

        <h2 class="text-xl md:text-2xl font-black text-slate-900">1 — المس ${s.name} بإصبعك</h2>
        <p class="text-base font-bold text-slate-600 mt-1">مرّر إصبعك على المسار حتى يمتلئ</p>
      </div>
      <div class="bg-white rounded-3xl p-4 border-2 border-amber-200 shadow-md flex items-center justify-center">
        <svg viewBox="0 0 200 200" class="trace-svg" id="trace-svg">
          <defs>
            <linearGradient id="traceGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0EA5E9"/>
              <stop offset="50%" stop-color="#8B5CF6"/>
              <stop offset="100%" stop-color="#10B981"/>
            </linearGradient>
          </defs>
          <path class="trace-path" d="${s.tracePath}"/>
          <path class="trace-progress" id="trace-progress" d="${s.tracePath}"/>
          <circle id="trace-start" cx="${startPoint(s).x}" cy="${startPoint(s).y}" r="14" fill="#F59E0B" class="pulse-glow"/>
        </svg>
      </div>
      <div class="text-center"><button onclick="skipTrace()" class="text-slate-500 font-bold text-xs underline hover:text-slate-700">تخطي (للمعلم)</button></div>
    </div>
  `;
  setupTrace();
}
function startPoint(s){
  if(s.key==='circle') return {x:100,y:20};
  if(s.key==='square') return {x:30,y:30};
  if(s.key==='triangle') return {x:100,y:25};
  return {x:20,y:55};
}
function setupTrace(){
  const svg=document.getElementById('trace-svg');
  const path=svg.querySelector('.trace-path');
  const prog=document.getElementById('trace-progress');
  const totalLen=path.getTotalLength();
  prog.style.strokeDasharray=totalLen; prog.style.strokeDashoffset=totalLen;
  let tracing=false,maxP=0,done=false;
  const start=document.getElementById('trace-start');
  function getPoint(e){
    const rect=svg.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX);
    const cy=(e.touches?e.touches[0].clientY:e.clientY);
    return {x:(cx-rect.left)/rect.width*200,y:(cy-rect.top)/rect.height*200};
  }
  function nearest(p){
    let best=0,bestD=Infinity;
    for(let i=0;i<=100;i++){ const pt=path.getPointAtLength(totalLen*i/100); const d=Math.hypot(p.x-pt.x,p.y-pt.y); if(d<bestD){bestD=d;best=i/100;} }
    return {progress:best,dist:bestD};
  }
  function onMove(e){
    if(!tracing||done) return; e.preventDefault();
    const p=getPoint(e); const {progress,dist}=nearest(p);
    if(dist<42 && progress>maxP){
      maxP=progress;
      prog.style.strokeDashoffset=totalLen*(1-maxP);
      if(maxP>0.05) start.style.opacity=0;
      if(maxP>0.95){
        done=true; tracing=false; successSound();
        feedback(true,`أَحْسَنْتِ! رَسَمْتِ ${SHAPES[currentShape].spoken}`);
        setTimeout(()=>{ speak(SHAPES[currentShape].spokenDesc,false); setTimeout(nextStage,1800); },700);
      }
    }
  }
  function onStart(e){tracing=true;onMove(e);}
  function onEnd(){tracing=false;}
  svg.addEventListener('pointerdown',onStart);
  svg.addEventListener('pointermove',onMove);
  svg.addEventListener('pointerup',onEnd);
  svg.addEventListener('pointerleave',onEnd);
  svg.addEventListener('touchstart',onStart,{passive:false});
  svg.addEventListener('touchmove',onMove,{passive:false});
  svg.addEventListener('touchend',onEnd);
}
function skipTrace(){ document.getElementById('trace-progress').style.strokeDashoffset=0; successSound(); setTimeout(nextStage,500); }

function stageCover(){
  const s=SHAPES[currentShape];
  speak(`الْمَرْحَلَةُ الثَّانِيَة: اِضْغَطِي عَلَى النِّقَاطِ لِتُغَطِّيَ ${s.spoken}.`);

          ${dots.map((d,i)=>`<circle class="cover-dot" data-i="${i}" cx="${d.x}" cy="${d.y}" r="14" fill="${s.color}" stroke="${s.stroke}" stroke-width="3" tabindex="0" role="button" aria-label="نقطة ${i+1}"/>`).join('')}
        </svg>

    </div>
  `;
  let covered=0;
  document.querySelectorAll('.cover-dot').forEach(dot=>{
    const handler=()=>{
      if(dot.classList.contains('covered')) return;
      dot.classList.add('covered'); clickSound(); covered++;
      if(covered>=dots.length){
        setTimeout(()=>{ feedback(true,`مُمْتَاز! غَطَّيْتِ ${SHAPES[currentShape].spoken} كَامِلاً`); setTimeout(nextStage,1700); },250);
      }
    };
    dot.addEventListener('click',handler);
    dot.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();}});
  });
}
function generateDots(key){
  const dots=[];
  if(key==='circle'){for(let i=0;i<12;i++){const a=i*Math.PI/6;dots.push({x:100+70*Math.cos(a),y:100+70*Math.sin(a)});}}
  else if(key==='square'){for(let i=0;i<12;i++){const t=i/12*4;const side=Math.floor(t),p=t-side;const pts=[[40,40],[160,40],[160,160],[40,160]];const nxt=[[160,40],[160,160],[40,160],[40,40]];dots.push({x:pts[side][0]+(nxt[side][0]-pts[side][0])*p,y:pts[side][1]+(nxt[side][1]-pts[side][1])*p});}}
  else if(key==='triangle'){for(let i=0;i<9;i++){const t=i/9*3;const side=Math.floor(t),p=t-side;const pts=[[100,35],[165,155],[35,155]];const nxt=[[165,155],[35,155],[100,35]];dots.push({x:pts[side][0]+(nxt[side][0]-pts[side][0])*p,y:pts[side][1]+(nxt[side][1]-pts[side][1])*p});}}
  else{for(let i=0;i<12;i++){const t=i/12*4;const side=Math.floor(t),p=t-side;const pts=[[30,65],[170,65],[170,135],[30,135]];const nxt=[[170,65],[170,135],[30,135],[30,65]];dots.push({x:pts[side][0]+(nxt[side][0]-pts[side][0])*p,y:pts[side][1]+(nxt[side][1]-pts[side][1])*p});}}
  return dots;
}
function skipCover(){ document.querySelectorAll('.cover-dot').forEach(d=>d.classList.add('covered')); successSound(); setTimeout(nextStage,500); }

function setupConnect(){
  let selected = null;
  let matched = 0;
  let targetMatched = false;
  const items = document.querySelectorAll('.connect-item');

  items.forEach(el=>{
    const handler = ()=>{
      if(el.classList.contains('matched')) return;
      clickSound();

      if(!selected){
        selected = el;
        el.classList.add('selected');
        return;
      }
      if(selected === el){
        selected.classList.remove('selected');
        selected = null;
        return;
      }

      const isPair = selected.dataset.k === el.dataset.k && selected.dataset.side !== el.dataset.side;
      const pairKey = el.dataset.k;

      if(isPair){
        const isCurrentShape = pairKey === currentShape;
        selected.classList.remove('selected');
        selected.classList.add('matched');
        el.classList.add('matched');
        selected = null;
        matched++;

        if(isCurrentShape && !targetMatched){
          targetMatched = true;
          showSuccessCheck();
          successSound();
          speak(`أَحْسَنْتِ! هَذَا هُوَ ${SHAPES[currentShape].spoken}!`, false);
          feedback(true, `مُمْتَاز! وَصَلْتِ ${SHAPES[currentShape].spoken} بِنَجَاح`);
        }else{
          successSound();
          speak(`أَحْسَنْتِ! هَذَا ${SHAPES[pairKey].spoken}`, false);
          feedback(true, `أَحْسَنْتِ! هَذَا ${SHAPES[pairKey].spoken}`);
        }

        if(matched >= 3 && targetMatched){
          setTimeout(()=>{ feedback(true,`رَائِع! وَصَلْتِ كُلَّ الْأَشْكَالِ بِظِلَالِهَا`); setTimeout(nextStage,1700); },1200);
        }
      }else{
        el.classList.add('shake');
        setTimeout(()=>el.classList.remove('shake'),500);
        wrongSound();

        if(selected.dataset.k === currentShape && !targetMatched){
          feedback(false, ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)]);
        }else{
          feedback(false, `حَاوِلِي مَرَّةً أُخْرَى`);
        }

        selected.classList.remove('selected');
        selected = null;
      }
    };
    el.addEventListener('click', handler);
    el.addEventListener('keydown', e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handler();}});
  });
}

function showSuccessCheck(){
  const overlay = document.createElement('div');

        <div class="w-32 h-32 mx-auto my-3">${s.svgFull()}</div>
        <p class="text-base font-bold text-slate-700">${s.desc}</p>
        <p class="text-sm font-bold text-slate-500 mt-2">${s.sides} • ${s.corners}</p>
      </div>
      <div class="flex flex-wrap justify-center gap-3">
        <button onclick="openMap()" class="btn-tactile bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg px-6 py-3 rounded-2xl border-2 border-emerald-700 shadow-md">الخريطة</button>
        <button onclick="showCertificate('${currentShape}')" class="btn-tactile bg-amber-500 hover:bg-amber-600 text-white font-black text-lg px-6 py-3 rounded-2xl border-2 border-amber-700 shadow-md">شهادة</button>
        <button onclick="startShape('${currentShape}')" class="btn-tactile bg-sky-500 hover:bg-sky-600 text-white font-black text-lg px-6 py-3 rounded-2xl border-2 border-sky-700 shadow-md">مراجعة</button>
      </div>
    </div>
  `;
  currentStage=6;
}

/* ============================================================
   الشهادة
   ============================================================ */
function showCertificate(k){
  clickSound();
  const s=SHAPES[k];
  const name=state.childName||'بطلتنا الصغيرة';
  document.getElementById('app').innerHTML=`
    <div class="fade-up space-y-4">
      <div class="bg-white rounded-3xl p-4 border-2 border-slate-200 flex flex-col sm:flex-row items-center justify-center gap-3 shadow-md no-print">
        <label for="name-input" class="font-black text-slate-700">اسم الطفلة:</label>
        <input id="name-input" type="text" placeholder="اكتبي الاسم" value="${state.childName}" oninput="setChildName(this.value)" class="border-2 border-indigo-300 rounded-xl px-4 py-2 text-lg font-bold text-center focus:outline-none focus:border-indigo-500 w-full sm:w-64">
      </div>
      <div id="print-area" class="certificate-bg rounded-3xl p-6 md:p-10 border-4 border-amber-400 shadow-2xl text-center">
        <div class="text-5xl md:text-6xl mb-2 flex justify-center">
          <svg viewBox="0 0 24 24" class="icon text-5xl" fill="#F59E0B"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <h2 class="text-2xl md:text-4xl font-black text-amber-700 mb-1">شهادة إتقان</h2>
        <p class="text-base font-bold text-slate-600 mb-4">تُمنح بكل فخر إلى</p>
        <div class="text-3xl md:text-4xl font-black text-slate-900 bg-yellow-100 inline-block px-8 py-3 rounded-2xl border-4 border-amber-300 mb-4">${name}</div>
        <p class="text-lg md:text-xl font-bold text-slate-700 mb-3">لإتقانها شكل <strong style="color:${s.color}">${s.name}</strong> عبر 5 مراحل تعليمية</p>
        <div class="w-24 h-24 mx-auto my-3">${s.svgFull()}</div>
        <div class="flex justify-center gap-1 mb-3">${[1,2,3,4,5].map(()=>`<svg viewBox="0 0 24 24" class="icon text-3xl" fill="#F59E0B"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`).join('')}</div>
        <div class="flex justify-center gap-3">
          ${KEYS.map(key=>`<div class="w-8 h-8 opacity-${state.shapeProgress[key]>=5?'100':'30'}">${SHAPES[key].svg()}</div>`).join('')}
        </div>
      </div>
      <div class="flex flex-wrap justify-center gap-3 no-print">
        <button onclick="window.print()" class="btn-tactile bg-indigo-500 hover:bg-indigo-600 text-white font-black text-lg px-6 py-3 rounded-2xl border-2 border-indigo-700 shadow-md">طباعة</button>
        <button onclick="openMap()" class="btn-tactile bg-slate-200 hover:bg-slate-300 text-slate-800 font-black text-lg px-6 py-3 rounded-2xl border-2 border-slate-400">الخريطة</button>
      </div>
    </div>
  `;
}
function setChildName(v){state.childName=v.trim();saveState();}

/* ============================================================
   وضع المعلم
   ============================================================ */
function openTeacher(){
  clickSound();
  const totalProg=KEYS.reduce((a,k)=>a+state.shapeProgress[k],0);
  document.getElementById('app').innerHTML=`
    <div class="fade-up space-y-4">
      <div class="bg-white rounded-3xl p-5 border-2 border-violet-200 shadow-md flex items-center justify-between flex-wrap gap-3">
        <h2 class="text-xl md:text-2xl font-black text-slate-900">وضع المعلم</h2>
        <button onclick="openMap()" class="btn-tactile bg-slate-100 text-slate-800 font-black px-4 py-2 rounded-xl border-2 border-slate-300 text-sm">الرحلة</button>
      </div>
      <div id="print-area" class="bg-white rounded-3xl p-5 border-2 border-amber-200 shadow-md">
        <h3 class="text-lg font-black text-slate-800 mb-3">تقرير التقدم</h3>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="bg-amber-50 rounded-2xl p-3 border-2 border-amber-200 text-center">
            <div class="text-2xl font-black text-amber-700">${state.stars}</div>
            <div class="text-xs font-bold text-amber-900">النجوم</div>
          </div>
          <div class="bg-emerald-50 rounded-2xl p-3 border-2 border-emerald-200 text-center">
            <div class="text-2xl font-black text-emerald-700">${totalProg}/20</div>
            <div class="text-xs font-bold text-emerald-900">مراحل مكتملة</div>
          </div>
        </div>
        <table class="w-full text-right text-sm">
          <thead><tr class="border-b-2 border-slate-200 text-xs text-slate-500"><th class="p-2">الشكل</th><th class="p-2">التقدم</th><th class="p-2">الأخطاء</th><th class="p-2">الحالة</th></tr></thead>
          <tbody>
            ${KEYS.map(k=>{
              const p=state.shapeProgress[k],done=p>=5;
              return `<tr class="border-b border-slate-100">
                <td class="p-2 font-black text-slate-800">${SHAPES[k].name}</td>
                <td class="p-2">${[1,2,3,4,5].map(n=>n<=p?'★':'☆').join('')}</td>
                <td class="p-2 font-bold text-rose-600">${state.mistakes[k]||0}</td>
                <td class="p-2 text-xs">${done?'<span class="text-emerald-700 font-black">مُتقن</span>':state.unlocked[k]?'<span class="text-sky-700 font-bold">مفتوح</span>':'<span class="text-slate-400">مقفل</span>'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div class="mt-4 flex flex-wrap gap-2 no-print">
          <button onclick="window.print()" class="btn-tactile bg-sky-500 text-white font-black px-4 py-2 rounded-xl border-2 border-sky-700 text-sm">طباعة</button>
          <button onclick="resetProgress()" class="btn-tactile bg-rose-500 text-white font-black px-4 py-2 rounded-xl border-2 border-rose-700 text-sm">إعادة ضبط</button>
        </div>
      </div>
      <div class="bg-white rounded-3xl p-5 border-2 border-teal-200 shadow-md no-print">
        <h3 class="text-lg font-black text-slate-800 mb-3">إعدادات</h3>
        <div class="mb-3">
          <span class="font-bold text-slate-700 text-sm">عدد الخيارات في "اعثر عليه":</span>
          <div class="flex gap-2 mt-2">
            ${[2,3,4].map(n=>`<button onclick="setDifficulty(${n})" class="btn-tactile font-black px-4 py-2 rounded-xl border-2 ${state.difficulty===n?'bg-teal-500 text-white border-teal-700':'bg-teal-50 text-teal-900 border-teal-200'}">${n}</button>`).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}
function setDifficulty(n){state.difficulty=n;saveState();openTeacher();clickSound();}
function resetProgress(){
  if(!confirm('هل تريد إعادة ضبط كل التقدم؟')) return;
  state=JSON.parse(JSON.stringify(DEFAULT_STATE));
  saveState(); applyTheme(); updateTopProgress(); openMap();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') openMap();
  if(e.key==='r'||e.key==='R') repeatPrompt();
});

function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

loadState();
</script>
</body>
</html>
